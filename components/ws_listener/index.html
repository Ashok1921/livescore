<!DOCTYPE html>
<html>
<head>
<script>
  function sendMessageToStreamlit(type, data) {
    const outgoingData = Object.assign({ isStreamlitMessage: true, type: type }, data);
    window.parent.postMessage(outgoingData, "*");
  }

  function initialize() {
    sendMessageToStreamlit("streamlit:componentReady", { apiVersion: 1 });
    sendMessageToStreamlit("streamlit:setFrameHeight", { height: 0 });
  }

  let ws = null;
  let wsUrl = null;
  let reconnectDelay = 1000;

  function connect() {
    if (!wsUrl) return;
    ws = new WebSocket(wsUrl);

    ws.onopen = function() {
      console.log("WS listener connected");
      reconnectDelay = 1000;
    };

    ws.onmessage = function(event) {
      sendMessageToStreamlit("streamlit:setComponentValue", {
        value: event.data,
        dataType: "json",
      });
    };

    ws.onclose = function() {
      console.log("WS closed, retrying in " + reconnectDelay + "ms");
      setTimeout(connect, reconnectDelay);
      reconnectDelay = Math.min(reconnectDelay * 2, 15000);
    };

    ws.onerror = function() {
      ws.close();
    };
  }

  window.addEventListener("message", function(event) {
    const data = event.data;
    if (data.type === "streamlit:render" && !wsUrl && data.args && data.args.ws_url) {
      wsUrl = data.args.ws_url;
      connect();
    }
  });

  window.addEventListener("load", initialize);
</script>
</head>
<body></body>
</html>
